<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" rx="8" fill="#1e293b"/>
  <!-- GPU Card -->
  <rect x="8" y="20" width="48" height="24" rx="2" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
  <!-- GPU Die -->
  <rect x="12" y="24" width="12" height="12" fill="#64748b"/>
  <text x="18" y="32" text-anchor="middle" fill="#3b82f6" font-family="Arial, sans-serif" font-size="6">GPU</text>
  <!-- VRAM -->
  <rect x="28" y="24" width="8" height="4" fill="#64748b"/>
  <rect x="28" y="30" width="8" height="4" fill="#64748b"/>
  <rect x="28" y="36" width="8" height="4" fill="#64748b"/>
  <!-- PCIe connector -->
  <rect x="40" y="28" width="12" height="4" fill="#64748b"/>
  <!-- Cooling fins -->
  <rect x="10" y="16" width="44" height="2" fill="#3b82f6" opacity="0.6"/>
  <rect x="10" y="46" width="44" height="2" fill="#3b82f6" opacity="0.6"/>
  <text x="32" y="56" text-anchor="middle" fill="#3b82f6" font-family="Arial, sans-serif" font-size="8" font-weight="bold">RTX 4070</text>
</svg>