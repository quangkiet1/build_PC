<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" rx="8" fill="#1e293b"/>
  <!-- RAM Module -->
  <rect x="20" y="16" width="24" height="32" rx="2" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
  <!-- Memory chips -->
  <rect x="24" y="20" width="4" height="6" fill="#64748b"/>
  <rect x="30" y="20" width="4" height="6" fill="#64748b"/>
  <rect x="36" y="20" width="4" height="6" fill="#64748b"/>
  <rect x="24" y="28" width="4" height="6" fill="#64748b"/>
  <rect x="30" y="28" width="4" height="6" fill="#64748b"/>
  <rect x="36" y="28" width="4" height="6" fill="#64748b"/>
  <!-- Heat spreader -->
  <rect x="22" y="18" width="20" height="28" rx="1" fill="#3b82f6" opacity="0.3"/>
  <!-- Contact pins -->
  <rect x="18" y="38" width="28" height="2" fill="#64748b"/>
  <text x="32" y="52" text-anchor="middle" fill="#3b82f6" font-family="Arial, sans-serif" font-size="8" font-weight="bold">DDR5 RAM</text>
</svg>