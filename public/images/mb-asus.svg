<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" rx="8" fill="#1e293b"/>
  <!-- Mainboard PCB -->
  <rect x="8" y="16" width="48" height="32" rx="2" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
  <!-- CPU socket -->
  <rect x="24" y="24" width="8" height="8" rx="1" fill="#1a1d26" stroke="#3b82f6" stroke-width="1"/>
  <text x="28" y="30" text-anchor="middle" fill="#3b82f6" font-family="Arial, sans-serif" font-size="6">CPU</text>
  <!-- RAM slots -->
  <rect x="36" y="22" width="2" height="12" fill="#64748b"/>
  <rect x="40" y="22" width="2" height="12" fill="#64748b"/>
  <rect x="44" y="22" width="2" height="12" fill="#64748b"/>
  <rect x="48" y="22" width="2" height="12" fill="#64748b"/>
  <!-- PCIe slots -->
  <rect x="12" y="28" width="8" height="2" fill="#64748b"/>
  <rect x="12" y="32" width="8" height="2" fill="#64748b"/>
  <!-- Chipset -->
  <rect x="16" y="36" width="6" height="6" fill="#3b82f6"/>
  <text x="32" y="52" text-anchor="middle" fill="#3b82f6" font-family="Arial, sans-serif" font-size="8" font-weight="bold">MAINBOARD</text>
</svg>