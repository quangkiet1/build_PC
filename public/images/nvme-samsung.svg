<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" rx="8" fill="#1e293b"/>
  <!-- SSD Case -->
  <rect x="16" y="24" width="32" height="16" rx="2" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
  <!-- NAND chips -->
  <rect x="20" y="28" width="4" height="8" fill="#64748b"/>
  <rect x="26" y="28" width="4" height="8" fill="#64748b"/>
  <rect x="32" y="28" width="4" height="8" fill="#64748b"/>
  <rect x="38" y="28" width="4" height="8" fill="#64748b"/>
  <!-- Controller -->
  <rect x="24" y="36" width="16" height="2" fill="#3b82f6"/>
  <!-- PCIe connector -->
  <rect x="12" y="30" width="4" height="4" fill="#64748b"/>
  <text x="32" y="52" text-anchor="middle" fill="#3b82f6" font-family="Arial, sans-serif" font-size="8" font-weight="bold">NVMe SSD</text>
</svg>